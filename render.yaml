# One service: the API serves the console, so there is a single origin and a single URL.
#
# Create it from the Render dashboard with "New → Blueprint" and point it at this repo.
# Everything below is set for you except the secrets, which Render will prompt for
# because they are marked `sync: false` and are never written down here.
services:
  - type: web
    name: interlock
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      # The version this was built and tested on. better-sqlite3 is a native module,
      # so the Node version is not a free choice: changing it means it is rebuilt or
      # recompiled, and that is worth doing deliberately rather than by drift.
      - key: NODE_VERSION
        value: 24.10.0

      # PayPal sandbox. Without these Interlock still runs and approved actions are
      # simulated and labelled as such, but nothing can be verified against PayPal.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX
        value: 'true'

      # The risk model and the agent. Without this the deterministic layer runs alone,
      # every proposal is labelled rules-only, and the Agent tab says why it cannot run.
      - key: OPENAI_API_KEY
        sync: false

      # The free plan has no disk, so the queue is rebuilt at every cold start. Scoring
      # it with the model would spend one model call per proposal each time it wakes —
      # which strangers visiting the URL would be triggering, without a ceiling. So the
      # starting queue is scored by the rules alone. Everything filed after boot, which
      # is every agent run, is scored by the model as normal. Set this to 'true' only if
      # you want to pay for the starting queue too.
      - key: INTERLOCK_SEED_MODEL
        value: 'false'

      # Both jobs run on the default model. Pin INTERLOCK_RISK_MODEL to something cheaper
      # only with a measurement to show the risk layer still finds what it found before.
      # - key: INTERLOCK_RISK_MODEL
      #   value: gpt-4.1-mini

      # An agent run is a multi-turn model conversation, and this URL and its tokens are
      # both published. This is the ceiling on how many runs the service will start
      # before it refuses, per process — so a cold start resets it, and a visitor cannot
      # spend without a bound. Reads, decisions and the queue are unaffected.
      - key: INTERLOCK_AGENT_RUN_BUDGET
        value: '25'

      # Published demo credentials, so a judge can sign in. Change them and the README's
      # sign-in table stops being true, so change both together.
      - key: INTERLOCK_AGENT_TOKEN
        value: demo-agent-token
      - key: INTERLOCK_REVIEWER_TOKEN
        value: demo-reviewer-token

      # Captures in the sandbox this was built against. Point these at your own sandbox
      # if you are running a copy; left unset, those scenarios show as unverifiable,
      # which is the honest result rather than a broken one.
      - key: INTERLOCK_DEMO_CAPTURE
        value: '97H84399YC068270R'
      - key: INTERLOCK_DEMO_PART_REFUNDED
        value: '1SH756385W667132X'

      # The free plan has no persistent disk, so the database is rebuilt from the seed
      # on every restart. That is fine for a demo and means the audit chain starts over
      # with it; see "Deploying" in the README.
      - key: INTERLOCK_DB
        value: /tmp/interlock.sqlite
